<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin | Photographer SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <style>
    .super-admin-layout { max-width: 800px; margin: 40px auto; }
  </style>
</head>
<body>

<div id="loginSection" class="login-center">
  <div class="login-box card">
    <div class="login-logo">
      <div class="logo-icon">👑</div>
      <h1>Super Admin</h1>
      <p>Manage Photographers</p>
    </div>
    <form id="saLoginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="saUsername" class="form-input" required placeholder="superadmin">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="saPassword" class="form-input" required placeholder="superadmindummy">
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-16">Login as Super Admin</button>
    </form>
  </div>
</div>

<div id="dashboardSection" class="hidden container super-admin-layout">
  <div class="nav">
    <div class="nav-brand"><div class="brand-icon">👑</div> Super Admin Dashboard</div>
    <button class="btn btn-ghost" onclick="saLogout()">Logout</button>
  </div>

  <div class="page-header">
    <h1>Photographers Manager</h1>
    <p>Create and manage photographer accounts.</p>
  </div>

  <div class="card mb-16">
    <h3 class="card-title">Add New Photographer</h3>
    <form id="addAdminForm" class="grid-3 mt-16" style="align-items: end;">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="newAdminUser" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="text" id="newAdminPass" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-success" style="margin-bottom: 16px;">Create Photographer</button>
    </form>
  </div>

  <div class="card">
    <h3 class="card-title mb-16">Existing Photographers</h3>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="adminsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
function showToast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerText = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Check session
fetch('/api/superadmin/status').then(r=>r.json()).then(data => {
  if(data.loggedIn) showDashboard();
});

document.getElementById('saLoginForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/superadmin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: e.target.saUsername.value,
      password: e.target.saPassword.value
    })
  });
  if(res.ok) {
    showDashboard();
  } else {
    showToast('Login Failed', 'error');
  }
};

async function showDashboard() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('dashboardSection').classList.remove('hidden');
  loadAdmins();
}

async function saLogout() {
  await fetch('/api/superadmin/logout', {method:'POST'});
  location.reload();
}

async function loadAdmins() {
  const res = await fetch('/api/superadmin/admins');
  const admins = await res.json();
  const tbody = document.getElementById('adminsTableBody');
  tbody.innerHTML = '';
  admins.forEach(a => {
    tbody.innerHTML += `
      <tr>
        <td>${a.id}</td>
        <td>${a.username}</td>
        <td>${new Date(a.created_at).toLocaleString()}</td>
        <td><button class="btn btn-danger btn-sm" onclick="delAdmin(${a.id})">Delete</button></td>
      </tr>
    `;
  });
}

document.getElementById('addAdminForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/superadmin/admins', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      username: e.target.newAdminUser.value,
      password: e.target.newAdminPass.value
    })
  });
  if(res.ok) {
    showToast('Photographer created', 'success');
    e.target.reset();
    loadAdmins();
  } else {
    showToast('Error creating photographer', 'error');
  }
};

window.delAdmin = async (id) => {
  if(!confirm('Are you sure?')) return;
  const res = await fetch('/api/superadmin/admins/'+id, {method:'DELETE'});
  if(res.ok) loadAdmins();
};
</script>
</body>
</html>
