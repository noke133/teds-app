<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gallery</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    /* iOS Photos App Inspired Styles */
    :root {
      --bg: #000; --text: #fff; --accent: #0A84FF;
      --nav-bg: rgba(25, 25, 25, 0.85); --border: rgba(255, 255, 255, 0.15); --red: #FF453A;
    }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: none; -webkit-font-smoothing: antialiased;
    }

    /* Fixed Header */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: 44px; padding-top: env(safe-area-inset-top);
      background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex; align-items: center; justify-content: space-between;
      padding-left: 16px; padding-right: 16px; border-bottom: 0.5px solid var(--border); z-index: 100;
    }
    header h1 { font-size: 17px; font-weight: 600; margin: 0; }
    .header-btn { color: var(--accent); background: none; border: none; font-size: 17px; padding: 0; cursor: pointer; }

    main {
      padding-top: calc(44px + env(safe-area-inset-top)); padding-bottom: calc(50px + env(safe-area-inset-bottom));
      height: 100vh; box-sizing: border-box; overflow-y: scroll; -webkit-overflow-scrolling: touch;
    }

    /* Setup Google Drive Flow */
    .setup-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 30px;
    }
    .setup-container h2 { font-size: 1.5rem; margin-bottom: 10px; }
    .setup-container p { color: #8E8E93; margin-bottom: 30px; font-size: 0.95rem; }
    .btn-google {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background: #fff; color: #000; text-decoration: none; padding: 14px 24px;
      border-radius: 12px; font-weight: 600; font-size: 1.1rem;
    }
    
    /* Image Grid (Photos style) */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .grid-item { position: relative; aspect-ratio: 1 / 1; background: #222; overflow: hidden; }
    .grid-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Selection Heart Overlay */
    .heart-btn {
      position: absolute; bottom: 4px; right: 4px; width: 28px; height: 28px;
      background: rgba(0,0,0,0.4); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.7); font-size: 16px;
      border: 1px solid rgba(255,255,255,0.2); cursor: pointer; backdrop-filter: blur(4px);
    }
    .heart-btn.selected { color: var(--red); background: rgba(255,255,255,0.9); border: 1px solid #fff; }

    /* Bottom Tab Navigation */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 50px; padding-bottom: env(safe-area-inset-bottom);
      background: var(--nav-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      display: flex; align-items: center; justify-content: space-evenly; border-top: 0.5px solid var(--border); z-index: 100;
    }
    .tab {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 50%; height: 100%; color: #8E8E93; font-size: 10px; font-weight: 500; text-decoration: none; cursor: pointer;
    }
    .tab.active { color: var(--accent); }
    .tab-icon { font-size: 20px; margin-bottom: 2px; }

    /* Lightbox (Full Screen View) */
    #lightbox { position: fixed; inset: 0; z-index: 200; background: #000; display: none; flex-direction: column; }
    .lb-header {
      height: 44px; padding-top: env(safe-area-inset-top); display: flex; justify-content: space-between; align-items: center;
      padding-left: 16px; padding-right: 16px; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
    }
    .lb-content { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .lb-content img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .loader { margin: auto; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; width: 24px; height: 24px; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    .folder-title { grid-column: 1 / -1; font-size: 15px; font-weight: 600; padding: 24px 16px 8px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 0.5px solid var(--border); margin-bottom: 2px; scroll-margin-top: 44px;}

    /* Albums Horizontal Strip */
    .albums-header { grid-column: 1 / -1; padding: 16px 16px 8px; font-size: 1.2rem; font-weight: 700; margin-top: 10px; }
    .albums-scroll { 
      display: flex; gap: 12px; padding: 0 16px 16px; 
      overflow-x: auto; scroll-snap-type: x mandatory; 
      -webkit-overflow-scrolling: touch; grid-column: 1 / -1; 
      border-bottom: 0.5px solid var(--border);
    }
    .albums-scroll::-webkit-scrollbar { display: none; }
    .album-card { 
      scroll-snap-align: start; flex-shrink: 0; width: 140px; 
      display: flex; flex-direction: column; cursor: pointer;
    }
    .album-cover-wrap { 
      width: 140px; height: 140px; border-radius: 12px; overflow: hidden; 
      margin-bottom: 8px; background: #222; border: 1px solid var(--border);
    }
    .album-cover { width: 100%; height: 100%; object-fit: cover; }
    .album-name { font-size: 0.95rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .album-count { font-size: 0.8rem; color: #8E8E93; }

    /* Download Overlay */
    #downloadProgress {
      position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.8);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-size: 1.2rem; text-align: center;
    }
  </style>
</head>
<body>

<div id="downloadProgress">
  <div class="loader" style="width:40px;height:40px;margin-bottom:20px;"></div>
  <div id="dlText">Preparing Download...</div>
  <div style="font-size:0.8rem; color:#8E8E93; margin-top:10px;">Please do not close this tab</div>
</div>

<header>
  <h1 id="headerTitle">Library</h1>
  <div>
    <button class="header-btn" onclick="downloadZip()" style="margin-right:12px; font-weight: 600;"><i class="bi bi-file-earmark-zip"></i> Zip</button>
    <button class="header-btn" onclick="logout()">Log Out</button>
  </div>
</header>

<main>
  <div id="loadingIndicator" class="loader" style="margin-top:40px;"></div>
  
  <div id="googleSetupView" class="setup-container hidden">
    <h2>Connect Your Drive</h2>
    <p>To view and store your photos, please connect your Google Drive account. Your photographer needs this to deliver your images.</p>
    <a href="/api/client/auth" class="btn-google"><i class="bi bi-cloud"></i> Connect Google Drive</a>
  </div>

  <div id="galleryView" class="grid hidden"></div>
  <div id="selectionsView" class="grid hidden"></div>
</main>

<nav id="bottomNav" class="hidden">
  <div class="tab active" id="tabLibrary" onclick="switchTab('library')"><div class="tab-icon"><i class="bi bi-images"></i></div>Library</div>
  <div class="tab" id="tabSelections" onclick="switchTab('selections')"><div class="tab-icon"><i class="bi bi-heart-fill"></i></div>Selections</div>
</nav>

<div id="lightbox">
  <div class="lb-header">
    <button class="header-btn" onclick="closeLightbox()">Back</button>
    <div>
      <button class="header-btn" title="Download Image" onclick="downloadSingleImage()" style="margin-right:16px;"><i class="bi bi-download"></i></button>
      <button class="header-btn" id="lbSelectBtn" onclick="toggleLightboxHeart()"><i class="bi bi-heart-fill"></i></button>
    </div>
  </div>
  <div class="lb-content"><img id="lbImage" src="" alt="Full Resolution"></div>
</div>

<script>
let allPhotos = []; let selectedIds = new Set();
let currentView = 'library'; let currentLightboxItem = null;

async function checkAuth() {
  const res = await fetch('/api/client/status');
  if(!res.ok) return window.location.href = '/login';
  const data = await res.json();
  if(!data.loggedIn) return window.location.href = '/login';
  
  document.getElementById('headerTitle').innerText = data.name + ' Gallery';
  document.getElementById('loadingIndicator').classList.add('hidden');

  if (!data.isConnected) {
    document.getElementById('googleSetupView').classList.remove('hidden');
  } else {
    document.getElementById('bottomNav').classList.remove('hidden');
    document.getElementById('galleryView').classList.remove('hidden');
    loadData();
  }
}

async function loadData() {
  document.getElementById('loadingIndicator').classList.remove('hidden');
  try {
    const [galRes, selRes] = await Promise.all([fetch('/api/client/gallery'), fetch('/api/client/selections')]);
    allPhotos = await galRes.json();
    const sels = await selRes.json();
    selectedIds = new Set(sels);
    
    document.getElementById('loadingIndicator').classList.add('hidden');
    renderGrid();
  } catch(err) { 
    document.getElementById('loadingIndicator').classList.add('hidden');
    console.error('Failed to load gallery', err); 
    alert("Failed to load your gallery: " + err.message);
  }
}

function renderGrid() {
  const libContainer = document.getElementById('galleryView');
  const selContainer = document.getElementById('selectionsView');
  libContainer.innerHTML = ''; selContainer.innerHTML = '';

  // 1. Build the Albums Horizontal Strip at the top of Library
  if (currentView === 'library') {
     const folders = [...new Set(allPhotos.map(p => p.folderName).filter(Boolean))];
     if (folders.length > 0) {
        libContainer.innerHTML += `<div class="albums-header">Albums</div><div class="albums-scroll">`;
        let scrollHTML = '';
        folders.forEach(f => {
           const folderPhotos = allPhotos.filter(p => p.folderName === f);
           const thumbRaw = folderPhotos[0]?.thumbnailLink;
           const cover = thumbRaw ? thumbRaw.replace(/=s\d+/, '=s400') : folderPhotos[0]?.webContentLink || ''; // 400px album cover
           const count = folderPhotos.length;
           scrollHTML += `
             <div class="album-card" onclick="document.getElementById('folder_${f}').scrollIntoView({behavior:'smooth'})">
                <div class="album-cover-wrap"><img src="${cover}" class="album-cover" loading="lazy"></div>
                <div class="album-name">${f}</div>
                <div class="album-count">${count} items</div>
             </div>
           `;
        });
        libContainer.innerHTML += scrollHTML + `</div>`;
     }
  }

  // 2. Build the main grid photos
  let lastFolder = null;
  allPhotos.forEach(photo => {
    const isSel = selectedIds.has(photo.id);
    const thumbRaw = photo.thumbnailLink;
    const hqThumb = thumbRaw ? thumbRaw.replace(/=s\d+/, '=s600') : photo.webContentLink || ''; // Increase physical DPI quality to 600px width
    const html = `
      <div class="grid-item">
        <img src="${hqThumb}" loading="lazy" onclick="openLightbox('${photo.id}')">
        <div class="heart-btn ${isSel?'selected':''}" onclick="toggleSelect(event, '${photo.id}')"><i class="bi bi-heart${isSel?'-fill':''}"></i></div>
      </div>
    `;
    
    // Insert section headers for folders in the Flat view
    if (photo.folderName && photo.folderName !== lastFolder) {
      if (currentView === 'library') {
          libContainer.innerHTML += `<div class="folder-title" id="folder_${photo.folderName}">${photo.folderName || 'Root'}</div>`;
      }
      lastFolder = photo.folderName;
    }
    
    libContainer.innerHTML += html;
    if(isSel) selContainer.innerHTML += html;
  });

  if(selectedIds.size === 0 && currentView === 'selections') {
    selContainer.innerHTML = '<div style="grid-column: 1/-1;text-align:center;padding:40px;color:gray;">No photos selected yet.</div>';
  }
}

function switchTab(tab) {
  currentView = tab;
  document.getElementById('tabLibrary').classList.toggle('active', tab==='library');
  document.getElementById('tabSelections').classList.toggle('active', tab==='selections');
  document.getElementById('galleryView').classList.toggle('hidden', tab!=='library');
  document.getElementById('selectionsView').classList.toggle('hidden', tab!=='selections');
  renderGrid(); 
}

async function toggleSelect(e, fileId) {
  if(e) e.stopPropagation();
  const isSelected = selectedIds.has(fileId); const newSelected = !isSelected;
  if(newSelected) selectedIds.add(fileId); else selectedIds.delete(fileId);
  renderGrid();
  await fetch('/api/client/selections', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({file_id: fileId, selected: newSelected})
  });
}

function openLightbox(fileId) {
  const photo = allPhotos.find(p => p.id === fileId);
  if(!photo) return;
  currentLightboxItem = photo;
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lbImage');
  const btn = document.getElementById('lbSelectBtn');
  
  img.src = photo.thumbnailLink.replace(/=s\d+/, '=s2048'); // Full super resolution 2048px lightbox
  const isSel = selectedIds.has(fileId);
  btn.style.opacity = isSel ? '1' : '0.5'; btn.innerHTML = isSel ? '<i class="bi bi-heart-fill"></i>' : '<i class="bi bi-heart"></i>';
  lb.style.display = 'flex';
}

function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; currentLightboxItem = null; }

function toggleLightboxHeart() {
  if(!currentLightboxItem) return;
  toggleSelect(null, currentLightboxItem.id);
  const isSel = selectedIds.has(currentLightboxItem.id);
  const btn = document.getElementById('lbSelectBtn');
  btn.style.opacity = isSel ? '1' : '0.5'; btn.innerHTML = isSel ? '<i class="bi bi-heart-fill"></i>' : '<i class="bi bi-heart"></i>';
}

async function logout() { await fetch('/api/client/logout', {method:'POST'}); window.location.reload(); }

// Client-Side Direct API ZIP Downloader (Concurrent Fast Mode)
async function downloadZip() {
  const p = document.getElementById('downloadProgress');
  const pText = document.getElementById('dlText');
  p.style.display = 'flex';
  
  try {
    pText.innerText = "Authenticating with Google...";
    const tokenRes = await fetch('/api/client/download-token');
    if(!tokenRes.ok) throw new Error("Failed to get download token");
    const { token } = await tokenRes.json();
    if(!token) throw new Error("No token returned");
    
    pText.innerText = "Initializing zip...";
    const zip = new JSZip();
    
    // Download what they are currently looking at
    let photosToDownload = currentView === 'selections' 
        ? allPhotos.filter(ph => selectedIds.has(ph.id)) 
        : allPhotos;
        
    if(photosToDownload.length === 0) {
      p.style.display = 'none'; return alert("No photos to download!");
    }

    let count = 0;
    const BATCH_SIZE = 5; // Download 5 full resolution images concurrently
    
    for(let i = 0; i < photosToDownload.length; i += BATCH_SIZE) {
        const batch = photosToDownload.slice(i, i + BATCH_SIZE);
        pText.innerText = `Downloading ${count} of ${photosToDownload.length}... (Fast Mode)`;
        
        await Promise.all(batch.map(async (ph, bIndex) => {
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${ph.id}?alt=media`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if(!res.ok) throw new Error("Google Drive API limit reached");
            const blob = await res.blob();
            let filename = ph.name || `photo_${count + bIndex}.jpg`;
            zip.file(filename, blob);
        }));
        
        count += batch.length;
    }
    
    pText.innerText = "Zipping files... (this may take a moment)";
    const content = await zip.generateAsync({type:"blob"});
    saveAs(content, document.getElementById('headerTitle').innerText + '.zip');
    p.style.display = 'none';
  } catch(err) {
    p.style.display = 'none';
    alert('Download failed: ' + err.message);
  }
}

// Client-Side Direct API Single Downloader
async function downloadSingleImage() {
  if (!currentLightboxItem) return;
  const p = document.getElementById('downloadProgress');
  const pText = document.getElementById('dlText');
  p.style.display = 'flex';
  
  try {
    pText.innerText = "Authenticating with Google...";
    const tokenRes = await fetch('/api/client/download-token');
    if(!tokenRes.ok) throw new Error("Failed to get download token");
    const { token } = await tokenRes.json();
    if(!token) throw new Error("No token returned");
    
    pText.innerText = "Downloading High-Res Image...";
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${currentLightboxItem.id}?alt=media`, {
        headers: { 'Authorization': 'Bearer ' + token }
    });
    if(!res.ok) throw new Error("Google Drive API limit reached or file not accessible");
    const blob = await res.blob();
    const filename = currentLightboxItem.name || `photo_${currentLightboxItem.id}.jpg`;
    
    saveAs(blob, filename);
    p.style.display = 'none';
  } catch(err) {
    p.style.display = 'none';
    alert('Download failed: ' + err.message);
  }
}

checkAuth();
</script>
</body>
</html>
