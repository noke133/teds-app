<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Super Admin | Photographer SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>

<div id="loginSection" class="login-center">
  <div class="login-box card" style="padding: 40px;">
    <div class="login-logo text-center">
      <div class="logo-icon text-center" style="margin: 0 auto 16px;">👑</div>
      <h1 style="font-size: 1.5rem; font-weight: 700;">Super Admin</h1>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Manage Photographers</p>
    </div>
    <form id="saLoginForm">
      <div class="form-group text-left" style="text-align: left;">
        <label class="form-label">Username</label>
        <input type="text" id="saUsername" class="form-input" required placeholder="superadmin">
      </div>
      <div class="form-group text-left" style="text-align: left;">
        <label class="form-label">Password</label>
        <input type="password" id="saPassword" class="form-input" required placeholder="superadmindummy">
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-16" style="padding: 12px; font-size: 1rem;">Login</button>
    </form>
  </div>
</div>

<div id="dashboardSection" class="app-layout hidden">
  
  <aside class="sidebar">
    <a href="#" class="sidebar-brand">
      <div class="brand-icon">👑</div> Admin
    </a>
    <nav class="sidebar-nav">
      <button class="nav-item active">
        <span class="icon">👥</span> Photographers
      </button>
      <button class="nav-item" style="color: var(--accent-red);" onclick="saLogout()">
        <span class="icon">🚪</span> Log out
      </button>
    </nav>
  </aside>

  <main class="main-content">
    <header class="top-header">
      <div class="header-search">
        <span style="color: var(--text-muted);">🔍</span>
        <input type="text" placeholder="Search photographers...">
      </div>
    </header>

    <div class="content-scroll">
      <div class="page-header">
        <div class="breadcrumbs">Dashboard > Accounts</div>
        <h1 class="page-title">Photographers Manager</h1>
        <p class="page-sub">Create and manage photographer accounts.</p>
      </div>

      <div class="grid-3 mb-24">
        <div class="card" style="grid-column: span 1;">
          <h3 class="card-title">Add New Photographer</h3>
          <p class="card-desc mb-16">Provision a new account for a photographer.</p>
          <form id="addAdminForm">
            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" id="newAdminUser" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="text" id="newAdminPass" class="form-input" required>
            </div>
            <button type="submit" class="btn btn-success btn-full mt-8">Create Photographer</button>
          </form>
        </div>
      </div>

      <div class="card">
        <h3 class="card-title mb-16">Existing Photographers</h3>
        <div style="overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm);">
          <table style="width: 100%; text-align: left; border-collapse: collapse;">
            <thead style="background: var(--bg-app); border-bottom: 1px solid var(--border);">
              <tr>
                <th style="padding: 12px 16px; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">ID</th>
                <th style="padding: 12px 16px; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">Username</th>
                <th style="padding: 12px 16px; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">Created</th>
                <th style="padding: 12px 16px; color: var(--text-secondary); font-size: 0.85rem; font-weight: 600;">Actions</th>
              </tr>
            </thead>
            <tbody id="adminsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script>
function showToast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div'); t.className = `toast ${type}`; t.innerText = msg; c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

fetch('/api/superadmin/status').then(r=>r.json()).then(data => { if(data.loggedIn) showDashboard(); });

document.getElementById('saLoginForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/superadmin/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: e.target.saUsername.value, password: e.target.saPassword.value })
  });
  if(res.ok) showDashboard(); else showToast('Login Failed', 'error');
};

async function showDashboard() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('dashboardSection').classList.remove('hidden');
  loadAdmins();
}

async function saLogout() { await fetch('/api/superadmin/logout', {method:'POST'}); location.reload(); }

async function loadAdmins() {
  const res = await fetch('/api/superadmin/admins');
  const admins = await res.json();
  const tbody = document.getElementById('adminsTableBody');
  tbody.innerHTML = '';
  admins.forEach(a => {
    tbody.innerHTML += `
      <tr style="border-bottom: 1px solid var(--border);">
        <td style="padding: 16px;">${a.id}</td>
        <td style="padding: 16px; font-weight: 500;">${a.username}</td>
        <td style="padding: 16px; color: var(--text-secondary);">${new Date(a.created_at).toLocaleString()}</td>
        <td style="padding: 16px;"><button class="btn btn-danger btn-sm" style="padding: 6px 12px; font-size:0.8rem;" onclick="delAdmin(${a.id})">Delete</button></td>
      </tr>
    `;
  });
}

document.getElementById('addAdminForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/superadmin/admins', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: e.target.newAdminUser.value, password: e.target.newAdminPass.value })
  });
  if(res.ok) { showToast('Photographer created', 'success'); e.target.reset(); loadAdmins(); } 
  else { showToast('Error creating photographer', 'error'); }
};

window.delAdmin = async (id) => {
  if(!confirm('Are you sure?')) return;
  const res = await fetch('/api/superadmin/admins/'+id, {method:'DELETE'});
  if(res.ok) loadAdmins();
};
</script>
</body>
</html>
