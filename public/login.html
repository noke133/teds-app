<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | noufal.info</title>
  <meta name="description" content="Access your professional photography gallery. Powered by noufal.info.">
  <meta name="viewport" content="width=viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/style.css?v=3">
  <style>
    /* Sleek Mobile Centered Auth */
    body { background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .auth-container { width: 100%; max-width: 400px; padding: 40px 30px; text-align: center; }
    .logo-circle { 
      width: 100px; height: 100px; background: rgba(255,255,255,0.05); 
      border-radius: 50%; display: flex; align-items: center; justify-content: center; 
      margin: 0 auto 24px auto; border: 1px solid rgba(255,255,255,0.1); overflow: hidden;
    }
    .logo-circle img { width: 80%; height: 80%; object-fit: contain; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
    p { color: rgba(255,255,255,0.5); margin-bottom: 32px; font-size: 0.95rem; }
    .code-input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 18px;
      width: 100%;
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 5px;
      color: #fff;
      backdrop-filter: blur(10px);
      transition: border 0.3s;
    }
    .code-input:focus { outline: none; border-color: #0A84FF; }
    .btn-login {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #0A84FF; /* iPhone Blue */
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn-login:hover { background: #0070DF; }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="logo-circle"><img src="/logo.png" alt="noufal.info logo"></div>
  <h1>noufal.info</h1>
  <p>Enter your unique passcode to access your gallery.</p>

  <form id="clientLoginForm">
    <input type="text" id="passcode" class="code-input" placeholder="000000" autocomplete="off" required>
    <button type="submit" class="btn-login">Open Gallery</button>
  </form>

  <footer style="margin-top: 60px; font-size: 0.75rem; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; text-transform: uppercase;">
    &copy; 2026 noufal.info &bull; 
    <a href="/privacy.html" style="color: inherit; text-decoration: none;">Privacy</a> &bull; 
    <a href="/terms.html" style="color: inherit; text-decoration: none;">Terms</a>
  </footer>
</div>

<div id="toast-container" style="display:none;"></div>
<script>
  // Auto-fill code from URL ?code=123456
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if(code) {
    document.getElementById('passcode').value = code;
    // Auto submit if desired, but user interaction is better for mobile browsers
  }

  document.getElementById('clientLoginForm').onsubmit = async (e) => {
    e.preventDefault();
    const passcode = document.getElementById('passcode').value.trim();
    if(!passcode) return;

    try {
      const res = await fetch('/api/client/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({passcode})
      });
      const data = await res.json();
      if(res.ok) {
        window.location.href = '/gallery'; // Redirect to gallery
      } else {
        alert(data.error || 'Invalid passcode');
      }
    } catch(err) {
      alert('Network error. Please try again.');
    }
  };
</script>
</body>
</html>
