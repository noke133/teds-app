<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photographer Dashboard | SaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-layout { max-width: 1000px; margin: 40px auto; }
    .client-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .client-link { color: var(--accent-blue); word-break: break-all; font-size: 0.85rem; }
    .folder-view { display: none; }
  </style>
</head>
<body>

<div id="loginSection" class="login-center">
  <div class="login-box card">
    <div class="login-logo">
      <div class="logo-icon">📷</div>
      <h1>Photographer Login</h1>
      <p>Manage your clients and galleries</p>
    </div>
    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="adminUser" class="form-input" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="adminPass" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full mt-16">Login</button>
    </form>
  </div>
</div>

<div id="dashboardSection" class="hidden container admin-layout">
  <div class="nav">
    <div class="nav-brand"><div class="brand-icon">📷</div> Photographer Studio</div>
    <button class="btn btn-ghost" onclick="adminLogout()">Logout</button>
  </div>

  <div id="mainDashboard" class="hidden mt-24">
    <div class="grid-2">
      <!-- Create Client -->
      <div class="card">
        <h3 class="card-title">New Client</h3>
        <p class="card-sub">Generate a secure login passcode for a new client.</p>
        <form id="createClientForm">
          <div class="form-group">
            <label class="form-label">Client / Event Name</label>
            <input type="text" id="newClientName" class="form-input" required>
          </div>
          <button type="submit" class="btn btn-success mt-8">Create Client</button>
        </form>
      </div>

      <!-- Clients List -->
      <div class="card">
        <h3 class="card-title">Your Clients</h3>
        <div id="clientsList" class="mt-16" style="max-height: 400px; overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- Folder Management View -->
  <div id="folderSection" class="folder-view mt-24">
    <button class="btn btn-ghost mb-16" onclick="closeFolderView()">&larr; Back to Dashboard</button>
    <div class="card">
      <h3 class="card-title">Managing: <span id="managingClientName"></span></h3>
      <p class="card-sub">Passcode: <strong class="text-primary" id="managingPasscode"></strong> | 
         Link: <a href="#" id="managingLink" target="_blank" class="client-link">...</a></p>
      
      <div class="grid-2 mt-16">
        <div>
          <h4 class="mb-16">📁 Subfolders</h4>
          <form id="createSubfolderForm" class="flex gap-8 mb-16">
            <input type="text" id="subfolderName" class="form-input" placeholder="Folder Name" required>
            <button type="submit" class="btn btn-primary">Create</button>
          </form>
          <div id="subfolderList" class="file-list"></div>
        </div>

        <div>
           <h4 class="mb-16">🖼️ Upload to Folder</h4>
           <div class="form-group">
              <label class="form-label">Select Destination Folder</label>
              <select id="uploadTargetFolder" class="form-input">
                <option value="ROOT">Root Gallery</option>
              </select>
           </div>
           <div class="drop-zone mt-16" id="uploadZone">
              <div class="drop-zone-icon">☁️</div>
              <h3>Drag & Drop Photos</h3>
              <p>or click to select</p>
              <input type="file" id="fileInput" multiple accept="image/*">
           </div>
           <div class="progress-wrap hidden" id="uploadProgressWrap">
              <div class="progress-bar" id="uploadProgressBar"></div>
           </div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="toast-container"></div>
<script>
function showToast(msg, type='info') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div'); t.className = `toast ${type}`; t.innerText = msg; c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

let activeClientId = null;
let activeFolderId = null;

// Auth Check
fetch('/api/admin/status').then(r=>r.json()).then(data => {
  if (data.loggedIn) {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('dashboardSection').classList.remove('hidden');
    document.getElementById('mainDashboard').classList.remove('hidden');
    loadClients();
  }
});

document.getElementById('adminLoginForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ username: e.target.adminUser.value, password: e.target.adminPass.value })
  });
  if(res.ok) location.reload();
  else showToast('Login Failed', 'error');
};

async function adminLogout() { await fetch('/api/admin/logout', {method:'POST'}); location.reload(); }

async function loadClients() {
  const res = await fetch('/api/clients');
  const clients = await res.json();
  const cl = document.getElementById('clientsList');
  cl.innerHTML = '';
  clients.forEach(c => {
    const link = window.location.origin + '/login?code=' + c.passcode;
    const connectedBadge = c.isConnected ? 
        '<span class="badge badge-green mt-8">Drive Connected</span>' : 
        '<span class="badge badge-yellow mt-8">Waiting for Client</span>';
    
    cl.innerHTML += `
      <div class="client-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div>
            <strong>${c.name}</strong><br>
            <span class="badge badge-blue mt-8">Code: ${c.passcode}</span>
            ${connectedBadge}
          </div>
          <button class="btn btn-sm btn-ghost" onclick="manageClient('${c.id}', '${c.name}', '${c.passcode}', '${c.drive_folder_id}', ${c.isConnected})">
             ${c.isConnected ? 'Manage' : 'View Link'}
          </button>
        </div>
        <div class="mt-8">
          <a href="${link}" target="_blank" class="client-link">${link}</a>
        </div>
      </div>
    `;
  });
}

document.getElementById('createClientForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch('/api/clients', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: e.target.newClientName.value})
  });
  if(res.ok) {
    showToast('Client created! Share the link with them to connect their Drive.', 'success');
    e.target.reset();
    loadClients();
  } else {
    const data = await res.json();
    showToast('Error: ' + (data.error || 'Server failed'), 'error');
  }
};

function manageClient(clientId, name, passcode, drive_folder_id, isConnected) {
  if (!isConnected) {
     alert("The client must log in and connect their Google Drive before you can manage their folders.");
     return;
  }
  document.getElementById('mainDashboard').classList.add('hidden');
  document.getElementById('folderSection').style.display = 'block';
  document.getElementById('managingClientName').innerText = name;
  document.getElementById('managingPasscode').innerText = passcode;
  const link = window.location.origin + '/login?code=' + passcode;
  document.getElementById('managingLink').href = link;
  document.getElementById('managingLink').innerText = link;

  activeClientId = clientId;
  activeFolderId = drive_folder_id;
  loadSubfolders(clientId, drive_folder_id);
}

function closeFolderView() {
  document.getElementById('folderSection').style.display = 'none';
  document.getElementById('mainDashboard').classList.remove('hidden');
  activeClientId = null; activeFolderId = null;
}

async function loadSubfolders(clientId, rootFolderId) {
  const res = await fetch(`/api/drive/list/${clientId}/${rootFolderId}`);
  const files = await res.json();
  const subfolders = files.filter(f => f.mimeType === 'application/vnd.google-apps.folder');
  
  const list = document.getElementById('subfolderList');
  const sel = document.getElementById('uploadTargetFolder');
  
  list.innerHTML = '';
  sel.innerHTML = `<option value="${rootFolderId}">Root Gallery</option>`;
  if(subfolders.length === 0) list.innerHTML = '<p class="text-muted text-center py-4">No subfolders yet.</p>';
  
  subfolders.forEach(f => {
    sel.innerHTML += `<option value="${f.id}">${f.name}</option>`;
    list.innerHTML += `<div class="file-item"><div class="file-icon">📁</div><div class="file-info"><div class="file-name">${f.name}</div></div></div>`;
  });
}

document.getElementById('createSubfolderForm').onsubmit = async (e) => {
  e.preventDefault();
  const res = await fetch(`/api/drive/folders/${activeClientId}/${activeFolderId}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: e.target.subfolderName.value})
  });
  if(res.ok) { showToast('Subfolder Created', 'success'); e.target.reset(); loadSubfolders(activeClientId, activeFolderId); }
  else showToast('Failed to create subfolder', 'error');
};

document.getElementById('fileInput').addEventListener('change', async (e) => {
  if(!e.target.files.length) return;
  const folderToUpload = document.getElementById('uploadTargetFolder').value;
  const files = Array.from(e.target.files);
  
  document.getElementById('uploadProgressWrap').classList.remove('hidden');
  const bar = document.getElementById('uploadProgressBar'); bar.style.width = '0%';

  for (let i = 0; i < files.length; i++) {
     try {
       const sessionRes = await fetch(`/api/drive/upload-session/${activeClientId}/${folderToUpload}`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ name: files[i].name, mimeType: files[i].type })
       });
       const { sessionUrl } = await sessionRes.json();
       await fetch(sessionUrl, {
          method: 'PUT', headers: { 'Content-Length': files[i].size }, body: files[i]
       });
       bar.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
     } catch(err) { showToast('Error uploading ' + files[i].name, 'error'); }
  }
  showToast('Uploads complete!', 'success');
  setTimeout(()=>document.getElementById('uploadProgressWrap').classList.add('hidden'), 2000);
  document.getElementById('fileInput').value = '';
});

</script>
</body>
</html>
